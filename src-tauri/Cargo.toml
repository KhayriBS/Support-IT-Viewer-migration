[package]
name = "lumiere-tech-it"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumiere_tech_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
# Notifications natives Windows (Action Center) — utilisé pour avertir
# l'utilisateur quand une session distante démarre/se termine alors que
# la fenêtre est cachée dans le tray.
tauri-plugin-notification = "2"
# Plugin autostart : la logique réelle est ré-implémentée à la main
# dans `agent/autostart.rs` (clé registre HKCU\…\Run) pour avoir un
# contrôle exact sur le chemin exe + l'argument `--minimized`. Le plugin
# est listé ici par cohérence avec la spec mais n'est pas initialisé.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }

# ── Structured logging (remplace println!/eprintln! par des logs filtrables) ─
# Tous les modules de l'agent emettent via les macros `tracing::*`. Filtrage
# par niveau ou cible via la variable d'env RUST_LOG, ex :
#   RUST_LOG=lumiere_tech_it_lib=debug
#   RUST_LOG=lumiere_tech_it_lib::agent::webrtc=trace
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── HTTP client (remplace HttpClient C#) ──────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Async runtime (remplace Task/async-await C#) ──────────────────
# Features explicites (au lieu de "full" qui en active 64+) :
#  - rt-multi-thread : runtime multi-threadé (tauri::run en a besoin)
#  - macros          : tokio::spawn, tokio::select, #[tokio::main]
#  - time            : sleep, timeout, Instant
#  - sync            : Mutex, RwLock, broadcast, watch, oneshot
#  - io-util         : AsyncReadExt, AsyncWriteExt
#  - fs              : tokio::fs::{File, OpenOptions, canonicalize, read_dir, metadata}
#  - process         : tokio::process::Command (utilisé par ai_executor::do_shell)
#  - net             : TcpStream sous-jacent à tokio-tungstenite + reqwest
#  - signal          : graceful shutdown (ctrl-c handler côté Tauri)
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "time", "sync",
    "io-util", "fs", "process", "net", "signal",
] }

# ── WebSocket client (remplace ClientWebSocket C#) ────────────────
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
webrtc = "0.11"
webrtc-util = "0.9"
rtp = "0.11"
bytes = "1"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# ── AI agent input injection (souris/clavier portable) ────────────
# Utilise par ai_executor pour les actions Click / TypeText / Key envoyees
# par Gemini. Coexiste avec input_handler.rs (qui passe par les P/Invoke
# Windows direct pour le streaming d'input temps-reel viewer→agent).
enigo = "0.2"
openh264 = "0.6"

# ── Encoding ──────────────────────────────────────────────────────
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"

# ── Windows APIs : DXGI (screen capture) + user32 (input) ─────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Media",
    # user32 — mouse_event, SetCursorPos, keybd_event, VkKeyScan
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # UI Automation — used by privacy_filter.rs to enumerate password
    # fields (IUIAutomation, FindAll, BoundingRectangle). Requires
    # Win32_System_Com + Win32_System_Variant (already present below).
    "Win32_UI_Accessibility",
    # HiDPI : SetThreadDpiAwarenessContext pour que GDI BitBlt capture la
    # totalité de l'écran sur les displays scalés (4K @ 200%, etc.).
    "Win32_UI_HiDpi",
    # DXGI — Desktop Duplication (ScreenCapture)
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # OLE — pour les helpers SAFEARRAY (SafeArrayAccessData/Destroy/Get*Bound).
    # Utilisé par privacy_filter::extract_runtime_id pour transformer le
    # SAFEARRAY de i32 retourné par IUIAutomationElement::GetRuntimeId en
    # Vec<i32> servant d'identité stable du contrôle UIA.
    "Win32_System_Ole",
    # Registry — RegOpenKeyExW / RegSetValueExW pour l'autostart
    # (clé HKCU\Software\Microsoft\Windows\CurrentVersion\Run).
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # Shell : SHGetKnownFolderPath (résolution correcte du dossier Téléchargements
    # même sur Windows localisé / OneDrive / dossiers redirigés)
    "Win32_UI_Shell",
    "Win32_System_Com_StructuredStorage",
] }
